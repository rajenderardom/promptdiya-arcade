name: IndexNow ping
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        if: github.event_name == 'push'
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          HOST=promptdiya-arcade.vercel.app
          KEY=9e4e8e459fc04e0589389d1ce68d90f7
          URLS=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -s -c .)
          echo "URLs: $URLS"
          BODY=$(jq -n -c --arg h "$HOST" --arg k "$KEY" --argjson u "$URLS" '{host:$h,key:$k,keyLocation:("https://"+$h+"/"+$k+".txt"),urlList:$u}')
          CODE=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow HTTP $CODE"; cat resp.txt
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ]
